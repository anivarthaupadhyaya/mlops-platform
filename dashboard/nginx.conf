server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ingest {
        proxy_pass http://ingest:8001/ingest;
        proxy_set_header Host $host;
    }

    location /api/index/ {
        proxy_pass http://search:8003/index/;
        proxy_set_header Host $host;
    }

    location /api/search {
        proxy_pass http://search:8003/search;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }

    location /ws/ {
        proxy_pass http://telemetry:8002/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
