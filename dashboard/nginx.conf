resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location = /api/ingest {
        proxy_pass http://ingest:8001/ingest;
        proxy_set_header Host $host;
    }

    location /api/index/ {
        set $search_upstream search:8003;
        rewrite ^/api/index/(.*)$ /index/$1 break;
        proxy_pass http://$search_upstream;
        proxy_set_header Host $host;
    }

    location /api/search {
        set $search_upstream search:8003;
        proxy_pass http://$search_upstream/search$is_args$args;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }

    location /ws/ {
        proxy_pass http://telemetry:8002/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
